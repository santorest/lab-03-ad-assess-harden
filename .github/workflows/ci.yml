name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest
      - run: python -m adlab.findings findings/findings.yaml --check-scripts

  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer and Pester 5
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 5.7.1 -Force -Scope CurrentUser -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts -Recurse -Severity Warning,Error
          if ($r) { $r | Format-Table -AutoSize; exit 1 }
          $c = New-PesterConfiguration; $c.Run.Path = 'tests/powershell'; $c.Run.Exit = $true; $c.Output.Verbosity = 'Detailed'
          Invoke-Pester -Configuration $c

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Full-history scan with the pinned official image. (gitleaks-action scans only the pushed range and
      # fails on a new repository's first push, where the range's base commit has no parent.)
      - name: gitleaks (full history)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3
          git /repo --redact --verbose --exit-code 1
